<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo/Ad Blanking</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-panel {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
        }
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
        }
        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        .video-panel h3 {
            margin-top: 0;
            color: #888;
        }
        video, canvas {
            width: 100%;
            max-width: 768px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            background: #000;
        }
        .controls {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .prompt-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f0f0f;
            color: #fff;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn-primary {
            background: #0078d4;
            color: #fff;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        .status {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        .fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Logo/Ad Blanking (YOLO Detector)</h1>
        
        <div class="controls">
            <input type="text" id="prompt" class="prompt-input" 
                   placeholder='Comma-separated detection classes, e.g. "logo, advertising banner"'
                   value="corporate logo, brand logo, advertisement, billboard, sponsor">
            <button id="startBtn" class="btn btn-primary">Start Stream</button>
            <button id="stopBtn" class="btn btn-secondary">Stop</button>
            <button id="applyPromptBtn" class="btn btn-secondary">Apply Classes</button>
            <div id="status" class="status">Ready</div>
        </div>
        
        <div class="video-grid">
            <div class="video-panel">
                <h3>Input (Webcam)</h3>
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <div class="video-panel">
                <h3>Output (Processed)</h3>
                <button class="fullscreen-btn" id="fullscreenBtn">⛶ Fullscreen</button>
                <canvas id="outputCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const promptInput = document.getElementById('prompt');
        
        // Stream frames at 16:9 (1280x720), matching the backend's default
        // FRAME_WIDTH/FRAME_HEIGHT so its detector warmup compiles at the
        // right size.
        const STREAM_WIDTH = 1280;
        const STREAM_HEIGHT = 720;
        const STREAM_PARAMS = new URLSearchParams(location.search);
        const TARGET_FPS = Math.max(1, Math.min(60, Number(STREAM_PARAMS.get('fps') || 24)));
        const INPUT_QUALITY = Math.max(0.1, Math.min(0.95, Number(STREAM_PARAMS.get('quality') || 0.55)));

        // Offscreen canvas for frame extraction
        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        hiddenCanvas.width = STREAM_WIDTH;
        hiddenCanvas.height = STREAM_HEIGHT;
        canvas.width = STREAM_WIDTH;
        canvas.height = STREAM_HEIGHT;

        // Backend address: override with ?server=host:port in the URL.
        const SERVER = new URLSearchParams(location.search).get('server') || 'localhost:8000';

        let ws = null;
        let isProcessing = false;
        let streamActive = false;
        let frameCount = 0;
        let sentCount = 0;
        let gotFirstResponse = false;
        let lastFpsUpdate = Date.now();
        let lastSendTime = 0;

        function updateStatus(msg) {
            statusEl.textContent = msg;
        }

        async function startStream() {
            try {
                // Get webcam access, preferring a native 16:9 mode
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: STREAM_WIDTH },
                        height: { ideal: STREAM_HEIGHT },
                        aspectRatio: { ideal: STREAM_WIDTH / STREAM_HEIGHT }
                    }
                });
                video.srcObject = stream;
                
                // Connect WebSocket
                ws = new WebSocket(`ws://${SERVER}/ws/stream`);
                
                ws.onopen = () => {
                    updateStatus('Connected to server');
                    streamActive = true;
                    requestAnimationFrame(streamLoop);
                };
                
                ws.onmessage = async (event) => {
                    const blob = event.data;
                    const img = new Image();
                    img.src = URL.createObjectURL(blob);
                    
                    img.onload = () => {
                        gotFirstResponse = true;
                        ctx.clearRect(0, 0, STREAM_WIDTH, STREAM_HEIGHT);
                        ctx.drawImage(img, 0, 0, STREAM_WIDTH, STREAM_HEIGHT);
                        URL.revokeObjectURL(img.src);
                        isProcessing = false;
                        
                        // FPS counter
                        frameCount++;
                        const now = Date.now();
                        if (now - lastFpsUpdate > 1000) {
                            const fps = frameCount * 1000 / (now - lastFpsUpdate);
                            updateStatus(`Connected | ${fps.toFixed(1)} FPS`);
                            frameCount = 0;
                            lastFpsUpdate = now;
                        }
                    };
                    img.onerror = () => {
                        // Without this, one undecodable frame leaves
                        // isProcessing stuck true and the stream stalls.
                        console.error('Failed to decode output frame');
                        URL.revokeObjectURL(img.src);
                        isProcessing = false;
                    };
                };
                
                ws.onclose = () => {
                    updateStatus('Disconnected');
                    streamActive = false;
                };
                
                ws.onerror = (err) => {
                    updateStatus('WebSocket error');
                    console.error(err);
                };
                
            } catch (err) {
                updateStatus('Error: ' + err.message);
                console.error(err);
            }
        }

        function stopStream() {
            streamActive = false;
            if (ws) {
                ws.close();
                ws = null;
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            updateStatus('Stopped');
        }

        function streamLoop() {
            if (!streamActive) return;
            
            const now = performance.now();
            const sendInterval = 1000 / TARGET_FPS;
            if (video.readyState >= video.HAVE_CURRENT_DATA && 
                ws && ws.readyState === WebSocket.OPEN && 
                !isProcessing && now - lastSendTime >= sendInterval) {
                
                // Center-crop the webcam frame to 16:9 before scaling, so a
                // non-16:9 camera (e.g. 4:3) isn't stretched.
                const vw = video.videoWidth, vh = video.videoHeight;
                const targetRatio = STREAM_WIDTH / STREAM_HEIGHT;
                let sw = vw, sh = vh, sx = 0, sy = 0;
                if (vw / vh > targetRatio) {
                    sw = vh * targetRatio;
                    sx = (vw - sw) / 2;
                } else if (vw / vh < targetRatio) {
                    sh = vw / targetRatio;
                    sy = (vh - sh) / 2;
                }
                hiddenCtx.drawImage(video, sx, sy, sw, sh, 0, 0, STREAM_WIDTH, STREAM_HEIGHT);
                lastSendTime = now;
                
                hiddenCanvas.toBlob((blob) => {
                    if (blob) {
                        isProcessing = true;
                        ws.send(blob);
                        sentCount++;
                        if (!gotFirstResponse) {
                            updateStatus(`Connected | sent ${sentCount} frames, waiting for first output...`);
                        }
                    }
                }, 'image/jpeg', INPUT_QUALITY);
            }
            
            requestAnimationFrame(streamLoop);
        }

        async function applyPrompt() {
            const prompt = promptInput.value;
            try {
                const response = await fetch(`http://${SERVER}/api/prompt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (response.ok) {
                    updateStatus('Prompt applied: ' + prompt);
                }
            } catch (err) {
                updateStatus('Error applying prompt');
            }
        }

        document.getElementById('startBtn').addEventListener('click', startStream);
        document.getElementById('stopBtn').addEventListener('click', stopStream);
        document.getElementById('applyPromptBtn').addEventListener('click', applyPrompt);
        
        // Fullscreen toggle
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const canvas = document.getElementById('outputCanvas');
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().catch(err => {
                    console.error('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });
        
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreenBtn');
            btn.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
        });

        // Sync the UI with the backend: reflect the active mode and prefill
        // the input with the server-side prompt/classes. In "detect" mode
        // (the server default) the input is a comma-separated YOLO-World
        // class list, not a prompt.
        fetch(`http://${SERVER}/api/health`).then(r => r.json()).then(h => {
            if (h.mode === 'sana') {
                document.querySelector('h1').textContent = 'SANA-Streaming Video Processor';
                document.title = 'SANA-Streaming Video Processor';
                promptInput.placeholder = 'Enter processing prompt';
                document.getElementById('applyPromptBtn').textContent = 'Apply Prompt';
            }
            return fetch(`http://${SERVER}/api/prompt`);
        }).then(r => r.json()).then(p => {
            promptInput.value = p.prompt;
        }).catch(() => { /* server unreachable — leave the HTML defaults */ });
    </script>
</body>
</html>
