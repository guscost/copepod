<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANA-Streaming Video Processor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-panel {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
        }
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
        }
        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        .video-panel h3 {
            margin-top: 0;
            color: #888;
        }
        video, canvas {
            width: 100%;
            max-width: 512px;
            border-radius: 8px;
            background: #000;
        }
        .controls {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .prompt-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f0f0f;
            color: #fff;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn-primary {
            background: #0078d4;
            color: #fff;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        .status {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        .fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SANA-Streaming Video Processor</h1>
        
        <div class="controls">
            <input type="text" id="prompt" class="prompt-input" 
                   placeholder="Enter processing prompt"
                   value="Replace all corporate logos, and all still or video advertising, with black squares">
            <button id="startBtn" class="btn btn-primary">Start Stream</button>
            <button id="stopBtn" class="btn btn-secondary">Stop</button>
            <button id="applyPromptBtn" class="btn btn-secondary">Apply Prompt</button>
            <div id="status" class="status">Ready</div>
        </div>
        
        <div class="video-grid">
            <div class="video-panel">
                <h3>Input (Webcam)</h3>
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <div class="video-panel">
                <h3>Output (Processed)</h3>
                <button class="fullscreen-btn" id="fullscreenBtn">⛶ Fullscreen</button>
                <canvas id="outputCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const promptInput = document.getElementById('prompt');
        
        // Offscreen canvas for frame extraction
        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        hiddenCanvas.width = 512;
        hiddenCanvas.height = 512;
        canvas.width = 512;
        canvas.height = 512;

        let ws = null;
        let isProcessing = false;
        let streamActive = false;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();

        function updateStatus(msg) {
            statusEl.textContent = msg;
        }

        async function startStream() {
            try {
                // Get webcam access
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 512, height: 512 }
                });
                video.srcObject = stream;
                
                // Connect WebSocket
                ws = new WebSocket('ws://localhost:8000/ws/stream');
                
                ws.onopen = () => {
                    updateStatus('Connected to server');
                    streamActive = true;
                    requestAnimationFrame(streamLoop);
                };
                
                ws.onmessage = async (event) => {
                    const blob = event.data;
                    const img = new Image();
                    img.src = URL.createObjectURL(blob);
                    
                    img.onload = () => {
                        ctx.clearRect(0, 0, 512, 512);
                        ctx.drawImage(img, 0, 0, 512, 512);
                        URL.revokeObjectURL(img.src);
                        isProcessing = false;
                        
                        // FPS counter
                        frameCount++;
                        const now = Date.now();
                        if (now - lastFpsUpdate > 1000) {
                            const fps = frameCount * 1000 / (now - lastFpsUpdate);
                            updateStatus(`Connected | ${fps.toFixed(1)} FPS`);
                            frameCount = 0;
                            lastFpsUpdate = now;
                        }
                    };
                };
                
                ws.onclose = () => {
                    updateStatus('Disconnected');
                    streamActive = false;
                };
                
                ws.onerror = (err) => {
                    updateStatus('WebSocket error');
                    console.error(err);
                };
                
            } catch (err) {
                updateStatus('Error: ' + err.message);
                console.error(err);
            }
        }

        function stopStream() {
            streamActive = false;
            if (ws) {
                ws.close();
                ws = null;
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            updateStatus('Stopped');
        }

        function streamLoop() {
            if (!streamActive) return;
            
            if (video.readyState === video.HAVE_CURRENT_DATA && 
                ws && ws.readyState === WebSocket.OPEN && 
                !isProcessing) {
                
                hiddenCtx.drawImage(video, 0, 0, 512, 512);
                
                hiddenCanvas.toBlob((blob) => {
                    if (blob) {
                        isProcessing = true;
                        ws.send(blob);
                    }
                }, 'image/jpeg', 0.7);
            }
            
            requestAnimationFrame(streamLoop);
        }

        async function applyPrompt() {
            const prompt = promptInput.value;
            try {
                const response = await fetch('http://localhost:8000/api/prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (response.ok) {
                    updateStatus('Prompt applied: ' + prompt);
                }
            } catch (err) {
                updateStatus('Error applying prompt');
            }
        }

        document.getElementById('startBtn').addEventListener('click', startStream);
        document.getElementById('stopBtn').addEventListener('click', stopStream);
        document.getElementById('applyPromptBtn').addEventListener('click', applyPrompt);
        
        // Fullscreen toggle
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const canvas = document.getElementById('outputCanvas');
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().catch(err => {
                    console.error('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });
        
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreenBtn');
            btn.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
        });
    </script>
</body>
</html>
